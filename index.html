<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAS · Wooclap Révisions</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#182448;background:#f2f5fc}*{box-sizing:border-box}body{margin:0}.wrap{max-width:820px;margin:auto;padding:22px 16px 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.logo{font-size:24px;font-weight:850;color:#075bfa}.pill{background:#e1eaff;color:#1452c6;padding:7px 12px;border-radius:30px;font-size:12px;font-weight:750}.panel{background:white;border:1px solid #e2e8f2;border-radius:22px;padding:24px;margin-top:18px;box-shadow:0 7px 30px #152e6410}h1{font-size:clamp(25px,5vw,36px);margin:8px 0 12px}h2{font-size:clamp(20px,4vw,28px);line-height:1.38;margin:18px 0}p{line-height:1.65;color:#516078}.muted{color:#69768f;font-size:14px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}.btn{background:#075bfa;color:white;border:0;border-radius:13px;padding:14px 20px;font-weight:750;font-size:15px;cursor:pointer}.btn.secondary{background:#edf2fd;color:#1c3b78}.btn:disabled{opacity:.4;cursor:not-allowed}.choice{display:flex;align-items:flex-start;gap:13px;width:100%;text-align:left;background:#fff;border:2px solid #e3e9f4;border-radius:15px;padding:16px;margin:11px 0;font:inherit;line-height:1.45;color:#273457;cursor:pointer;white-space:pre-wrap}.choice.selected{border-color:#075bfa;background:#eff5ff}.choice.good{border-color:#20a66d;background:#eafaf2}.choice.bad{border-color:#e05a66;background:#fff1f1}.letter{background:#edf2fa;flex-shrink:0;width:30px;height:30px;display:grid;place-items:center;border-radius:9px;font-weight:750}.progress{height:8px;background:#e9edf6;border-radius:12px;overflow:hidden;margin:18px 0}.progress>div{height:100%;background:#075bfa;transition:width .2s}.explain{background:#eef7f3;border-left:4px solid #18a46e;padding:15px 17px;border-radius:12px;margin:16px 0;line-height:1.65}.warning{background:#fff8e7;border-left-color:#e0a324}.code{white-space:pre-wrap;overflow-x:auto;background:#14213b;color:#eaf1ff;padding:18px;border-radius:14px;line-height:1.65;font-size:14px}.figure{width:100%;max-height:480px;object-fit:contain;object-position:left center;background:#f8fafc;border-radius:13px;border:1px solid #e2e8f2}.thumb{width:130px;height:190px;object-fit:cover;object-position:top;border-radius:10px;border:1px solid #dde4ef;cursor:pointer}select{padding:13px;border:1px solid #d6dfef;border-radius:12px;background:white;color:#172448;max-width:100%}details{margin:14px 0}summary{cursor:pointer;color:#075bfa;font-weight:700} .hide{display:none}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#eff4ff;padding:17px;border-radius:14px;text-align:center}.stat b{display:block;font-size:27px}.foot{margin-top:20px;font-size:12px;color:#8290a9}@media(max-width:480px){.panel{padding:18px}.results{gap:6px}.stat{padding:10px}.stat b{font-size:21px}}
</style></head><body><div class="wrap"><div class="top"><div class="logo">● SAS Révisions</div><span class="pill">Wooclap · Nouvelle série</span></div><div id="app"></div></div><script>
const Q=[{"t": "PROC MEANS", "q": "Un tableau d'entrée doit être trié au préalable par la ou les colonnes énumérées dans l'instruction CLASS d'une étape PROC MEANS.", "a": ["Vrai", "Faux"], "c": 1, "e": "FAUX. CLASS regroupe les observations sans imposer un tri préalable. C'est BY qui exige en général des données triées (ou indexées).", "img": ["IMG_1891.PNG"]}, {"t": "Exportation", "q": "Quelle affirmation est fausse concernant les options de l'instruction PROC EXPORT ?", "a": ["L'option DATA= identifie la table SAS d'entrée.", "L'option REPLACE spécifie l'écrasement d'un fichier existant.", "L'option DBMS= spécifie l'identifiant de la base de données pour le type de fichier en cours de création.", "L'option OUT= indique le chemin d'accès et le nom du fichier de données externes en cours de création."], "c": 3, "e": "La destination d'un export est définie par OUTFILE=, pas OUT=. DATA= désigne la table source, DBMS= le format de sortie et REPLACE autorise l'écrasement.", "img": ["IMG_4519.PNG"]}, {"t": "Étape DATA", "q": "Quelle instruction est utilisée pour lire un ensemble de données SAS dans une étape DATA ?", "a": ["L'instruction DATA", "L'instruction WHERE", "L'instruction SET"], "c": 2, "e": "SET lit les observations d’une table SAS existante. DATA nomme la table créée et WHERE filtre les observations.", "img": ["IMG_4559 2.jpg"]}, {"t": "Conditions", "q": "Quelle affirmation est FAUSSE concernant le traitement conditionnel dans SAS ?", "a": ["Une boucle DO se termine toujours par l'instruction END", "Une boucle DO permet d'exécuter plusieurs instructions pour une expression IF-THEN vraie", "On peut toujours écrire plusieurs instructions après le THEN dans un IF-THEN"], "c": 2, "e": "Pour exécuter plusieurs instructions sous une même condition, on utilise THEN DO; ... END;. Sans DO/END, une seule instruction suit THEN.", "img": ["IMG_4567.PNG", "IMG_1881.PNG"]}, {"t": "Conditions", "q": "Dans le programme suivant, quelle sera la valeur de Credit si Country est \"au\" ?", "code": "data work.bonus;\n  set orion.sales;\n  if Country='US' then Credit=300;\n  else if Country='AU' then Credit=500;\n  else Credit=0;\nrun;", "a": ["300", "500", "0", "Manquant"], "c": 2, "e": "Les comparaisons de chaînes dans SAS sont sensibles à la casse : 'au' n'est pas égal à 'AU'. La branche ELSE donne donc Credit=0.", "img": ["IMG_1878.PNG"]}, {"t": "Variables", "q": "Quelle est la taille de la colonne Car_Type créée dans ce programme ?", "code": "data car_type;\n  set sashelp.cars;\n  if msrp>80000 then car_type=\"luxury\";\n  else car_type=\"regular\";\n  length car_type $ 8;\nrun;", "a": ["6", "7", "8"], "c": 0, "e": "La première affectation rencontrée à la compilation fixe la longueur de la variable caractère à 6 (longueur de 'luxury'). L'instruction LENGTH placée après cette première définition ne peut pas la modifier. 'regular' sera tronqué.", "img": ["IMG_1879.PNG"]}, {"t": "Fonctions", "q": "La variable Test aura-t-elle le même résultat avec les deux instructions suivantes ?", "code": "Test = Sum(Salary_N, Salary_N_1);\nTest = Salary_N + Salary_N_1;", "a": ["Oui", "Non", "Il n'y a pas assez d'informations pour répondre"], "c": 1, "e": "Non, pas toujours : SUM ignore les valeurs manquantes et additionne les valeurs disponibles, alors que l'opérateur + renvoie une valeur manquante si un opérande est manquant. Sans valeurs manquantes, les résultats coïncident.", "img": ["IMG_1880.PNG"]}, {"t": "Macros", "q": "Quelle instruction remplace la valeur de la macro-variable YEAR dans la note de bas de page ?", "a": ["footnote 'year Sales';", "footnote '&year Sales';", "footnote \"%year Sales\";", "footnote \"&year Sales\";"], "c": 3, "e": "Une macro-variable est référencée avec & et est résolue dans une chaîne entre guillemets doubles. Les apostrophes empêchent cette résolution.", "img": ["IMG_1883.PNG"]}, {"t": "Labels et reporting", "q": "Quelle affirmation est VRAIE concernant ce programme ?", "code": "data baseball2;\n  set sashelp.baseball;\n  BatAvg=CrHits/CrAtBat;\n  label BatAvg=\"Batting Average\";\nrun;\n\nproc print data=baseball2;\n  var Name Team BatAvg;\nrun;\n\nproc means data=baseball2;\n  var BatAvg;\n  class Team;\nrun;", "a": ["La colonne BatAvg aura un label permanent dans l'ensemble de données sashelp.baseball", "Le label BatAvg apparaîtra dans le rapport PROC PRINT", "Le label BatAvg apparaîtra dans le rapport PROC MEANS", "Le label BatAvg apparaîtra dans les deux rapports"], "c": 2, "e": "LABEL est stocké dans la nouvelle table baseball2, pas dans sashelp.baseball. PROC MEANS utilise le label dans son rapport. PROC PRINT, sans option LABEL, affiche normalement le nom de variable. ", "img": ["IMG_1884.PNG", "IMG_1885.PNG"]}, {"t": "Reporting", "q": "Quelle affirmation est VRAIE concernant l'instruction BY dans une procédure de reporting telle que PROC PRINT ?", "a": ["L'instruction BY est responsable du tri de la table", "Une seule colonne peut être spécifiée dans l'instruction BY", "L'instruction BY regroupe le rapport en fonction des colonnes spécifiées", "L'instruction BY doit être la première instruction après l'instruction PROC"], "c": 2, "e": "BY produit un traitement et un affichage par groupes de valeurs. Il ne trie pas lui-même les données et peut accepter plusieurs variables.", "img": ["IMG_1886.PNG"]}, {"t": "PROC FREQ", "q": "Quelle affirmation est FAUSSE concernant la procédure FREQ ?", "a": ["L'option NOPROCTITLE peut être placée dans l'instruction PROC FREQ pour supprimer le titre \"La procédure FREQ\"", "L'option ORDER=FREQ peut être placée dans l'instruction PROC FREQ pour afficher les valeurs des colonnes dans l'ordre décroissant du nombre de fréquences", "L'option PLOTS= peut être placée dans l'instruction TABLES après le slash pour créer des diagrammes à barres basés sur les effectifs ou les pourcentages", "L'option OUT= peut être placée dans l'instruction TABLES après le slash pour créer un tableau contenant des effectifs et des pourcentages"], "c": 0, "e": "NOPROCTITLE est une option ODS (ODS NOPROCTITLE;), pas une option valide dans PROC FREQ. Les autres options sont utilisables dans les emplacements décrits.", "img": ["IMG_1887.PNG", "IMG_1888.PNG"]}, {"t": "PROC FREQ", "q": "Quelle PROC FREQ permet de créer ce résultat ?", "a": ["proc freq data=sashelp.shoes;\n tables Region nocum;\nrun;", "proc freq data=sashelp.shoes levels;\n tables Region / nocum;\nrun;", "proc freq data=sashelp.shoes nlevels;\n tables Region / nocum;\nrun;", "proc freq data=sashelp.shoes levels;\n tables Region nocum;\nrun;"], "c": 2, "e": "NLEVELS affiche le nombre de modalités distinctes (10 pour Region). L’option / NOCUM supprime les colonnes de fréquence et de pourcentage cumulés.", "img": ["IMG_1889.PNG", "IMG_1890.PNG"], "figure": "IMG_1889.PNG"}, {"t": "Fonctions", "q": "Parmi les fonctions SAS suivantes, laquelle renvoie un nombre entre 1 et 12 ?", "a": ["YEAR(SAS-date-value)", "MONTH(SAS-date-value)", "WEEKDAY(SAS-date-value)", "Aucune"], "c": 1, "e": "MONTH renvoie un mois de 1 à 12.", "img": []}, {"t": "Bases SAS", "q": "Dans quelle partie d’un dataset SAS trouve-t-on le nom, le type de chaque colonne et la date de création du dataset ?", "a": ["Dans la partie description", "Dans la partie données"], "c": 0, "e": "Les métadonnées figurent dans la partie description.", "img": []}, {"t": "Importation", "q": "Le programme PROC IMPORT présenté donnera-t-il le résultat espéré ?", "a": ["Oui", "Non, VENTES.sas7bdat n’existe pas dans le dossier", "Non, une table SAS ne peut pas avoir le même nom qu’un fichier Excel", "Non, il y a une erreur dans l’instruction LIBNAME"], "c": 0, "e": "PROC IMPORT crée DATA.VENTES à partir du fichier Ventes.xlsx ; la table SAS n’a pas besoin d’exister avant l’importation.", "img": [], "figure": "figure_31.png"}, {"t": "Tri", "q": "Avec PROC SORT DATA=payment DUPOUT=dups NODUPKEY; BY ID;, combien de lignes restent dans payment ?", "a": ["1", "3", "5", "6"], "c": 1, "e": "NODUPKEY conserve un seul enregistrement par ID distinct : A, B, C.", "img": [], "figure": "figure_29.png"}, {"t": "Formats", "q": "Quelle instruction FORMAT produit les dates montrées dans le tableau ?", "a": ["format Order_Date date9. Delivery_Date mmddyy8.;", "format Order_Date date7. Delivery_Date mmddyy8.;", "format Order_Date ddmmyy. Delivery_Date mmddyy8.;", "format Order_Date monyy7. Delivery_Date mmddyy8.;"], "c": 1, "e": "DATE7. affiche 11JAN07 ; MMDDYY8. affiche 01/19/07.", "img": [], "figure": "figure_28.png"}, {"t": "Filtrage", "q": "Avec WHERE Job_Title LIKE \"Sales%\", quelles lignes sont sélectionnées ?", "a": ["La ligne 1", "La ligne 2", "La ligne 3", "Les lignes 1 et 2", "Toutes les lignes"], "c": 3, "e": "Sales% correspond aux textes commençant par Sales, donc lignes 1 et 2.", "img": [], "figure": "figure_26.png"}, {"t": "Tri", "q": "Quelle affirmation concernant cette PROC SORT est vraie ?", "a": ["Le tableau trié écrase le tableau d’entrée", "Les lignes sont triées par Salary dans l’ordre décroissant, puis par Manager_ID dans l’ordre décroissant", "Le nom de la table d’entrée ne doit pas être suivi d’un point-virgule", "La table triée contient uniquement les colonnes spécifiées dans l’instruction BY"], "c": 2, "e": "Le point-virgule après DATA=orion.staff terminerait prématurément l’instruction PROC SORT ; il faut placer OUT= dans la même instruction. DESCENDING ne s’applique qu’à Salary.", "img": [], "figure": "figure_25.png"}, {"t": "Filtrage", "q": "Quelle instruction sélectionne uniquement les lignes où Style vaut RANCH, SPLIT ou TWOSTORY ?", "a": ["where Style='RANCH' or 'SPLIT' or 'TWOSTORY';", "where Style in 'RANCH' or 'SPLIT' or 'TWOSTORY';", "where Style in (RANCH, SPLIT, TWOSTORY);", "where Style in ('RANCH', 'SPLIT', 'TWOSTORY');"], "c": 3, "e": "IN exige une liste entre parenthèses, avec les chaînes entre guillemets.", "img": []}, {"t": "Filtrage", "q": "Quelle instruction sélectionne Amount inférieur ou égal à 5000 ou Rate égal à 0.095 ?", "a": ["where amount <= 5000 or rate=0.095;", "where amount le 5000 or rate=0.095;", "where amount <= 5000 or rate eq 0.095;", "Toutes les instructions ci-dessus"], "c": 3, "e": "SAS accepte <= ou LE, et = ou EQ.", "img": []}, {"t": "Macro-variables", "q": "Quelle instruction crée une macro-variable flower et lui assigne Plumeria ?", "a": ["%let flower=Plumeria;", "%let flower=\"Plumeria\";", "%let &flower=Plumeria;", "%let &flower=\"Plumeria\";"], "c": 0, "e": "%LET nom=valeur; crée la macro-variable ; les guillemets seraient conservés dans sa valeur.", "img": []}, {"t": "PROC MEANS", "q": "Quelle instruction de PROC MEANS spécifie les colonnes numériques à analyser ?", "a": ["TABLES", "VARS", "VAR", "KEEP="], "c": 2, "e": "L’instruction VAR identifie les variables numériques analysées.", "img": []}, {"t": "PROC FREQ", "q": "Quelle procédure donne les valeurs distinctes de Flower_Type, leur décompte et leur pourcentage ?", "a": ["PRINT", "MEANS", "UNIVARIATE", "FREQ"], "c": 3, "e": "PROC FREQ fournit fréquences et pourcentages.", "img": []}, {"t": "Étape DATA", "q": "Dans quelle phase de l’étape DATA les erreurs de syntaxe sont-elles vérifiées ?", "a": ["Dans la phase de compilation", "Dans la phase d’exécution"], "c": 0, "e": "La compilation vérifie la syntaxe avant l’exécution.", "img": []}, {"t": "Étape DATA", "q": "Quel est le nom du dataset de sortie après ce programme ?", "a": ["work.us", "orion.sales", "Country", "sales"], "c": 0, "e": "DATA work.us désigne la table créée ; SET orion.sales est la source.", "img": [], "figure": "figure_18.png"}, {"t": "Étape DATA", "q": "orion.sales contient 9 colonnes. Combien de colonnes aura work.comp ?", "a": ["4", "9", "5", "Pas assez d’informations pour répondre"], "c": 0, "e": "KEEP limite la table de sortie aux quatre variables listées.", "img": [], "figure": "figure_17.png"}, {"t": "Fonctions", "q": "Quelle est la valeur de AvgExp pour cette observation ?", "a": ["6", "8", ". (valeur manquante)", "L’instruction va provoquer une erreur"], "c": 1, "e": "MEAN ignore les valeurs manquantes : (10+5+9)/3 = 8.", "img": [], "figure": "figure_16.png"}, {"t": "ODS", "q": "Parmi les codes suivants, lequel n’est pas valide pour une instruction ODS ?", "a": ["ods csvall file='c:\\temp\\myfile.csv';", "ods pdf file='c:\\temp\\myfile.pdf';", "ods powerpoint file='c:\\temp\\myfile.pptx';", "ods msword file='c:\\temp\\myfile.docx';"], "c": 0, "e": "La destination ODS CSVALL n’existe pas ; CSV est une destination reconnue.", "img": ["IMG_1837.PNG"]}, {"t": "ODS", "q": "Quelle instruction doit être ajoutée à la fin de ce programme ?", "a": ["ods clear;", "ods close;", "ods pdf clear;", "ods pdf close;"], "c": 3, "e": "ODS PDF CLOSE ferme le fichier PDF ouvert.", "img": ["IMG_1838.PNG"], "figure": "code_new_1.png"}, {"t": "ODS", "q": "Quelle instruction contient une syntaxe valide pour spécifier le nom d’une feuille de calcul ?", "a": ["ods excel sheet_name='Males';", "ods excel (sheet_name='Males');", "ods excel option(sheet_name='Males');", "ods excel options(sheet_name='Males');"], "c": 3, "e": "La syntaxe correcte est ODS EXCEL OPTIONS(SHEET_NAME='Males');", "img": ["IMG_1839.PNG"]}, {"t": "Étapes SAS", "q": "Combien d’étapes ce programme comporte-t-il ?", "a": ["2", "4", "8", "11"], "c": 1, "e": "Une étape DATA et trois étapes PROC : CONTENTS, PRINT et MEANS, soit quatre étapes.", "img": ["IMG_1840.PNG", "IMG_1841.PNG"], "figure": "code_new_3.png"}, {"t": "Syntaxe SAS", "q": "Lequel des éléments suivants est une exigence de la syntaxe SAS ?", "a": ["Commencer chaque instruction dans la première colonne", "Ne mettre qu’une seule instruction par ligne", "Séparer chaque étape par un interligne", "Terminez chaque déclaration par un point-virgule"], "c": 3, "e": "Les instructions SAS se terminent par un point-virgule.", "img": ["IMG_1843.PNG"]}, {"t": "Étapes SAS", "q": "Quelle étape vais-je généralement utiliser pour créer des rapports et graphiques ?", "a": ["DATA", "PROC"], "c": 1, "e": "Les procédures PROC servent notamment à produire des rapports et graphiques.", "img": ["IMG_1844.PNG"]}, {"t": "Commentaires", "q": "Le commentaire suivant contient-il une erreur de syntaxe ?", "a": ["Non", "Oui, chaque ligne doit finir par un point virgule", "Oui, il est sur plus d’une ligne", "Oui, il y a un point virgule au milieu du commentaire"], "c": 0, "e": "Un commentaire /* ... */ peut couvrir plusieurs lignes et contenir des points-virgules.", "img": ["IMG_1845.PNG"], "figure": "code_new_6.png"}, {"t": "PROC PRINT", "q": "Que va-t-il se passer si je lance le programme suivant ?", "a": ["La création d’une table nommée work.newsalesemps", "Un message d’erreur dans la log", "La création d’un rapport contenant les données de la table work.newsalesemps"], "c": 1, "e": "Il manque le point-virgule à la fin de PROC PRINT DATA=... ; SAS signalera une erreur.", "img": ["IMG_1846.PNG"], "figure": "code_new_7.png"}, {"t": "Syntaxe SAS", "q": "Ce programme contient une erreur car « National » est écrit à la fois en minuscule et en majuscule.", "a": ["Vrai", "Faux"], "c": 1, "e": "Les noms de jeux de données SAS ne sont pas sensibles à la casse.", "img": ["IMG_1847.PNG"], "figure": "code_new_8.png"}, {"t": "Syntaxe SAS", "q": "Combien de commandes ce code contient-il ?", "a": ["4", "5", "6", "7", "8", "9"], "c": 2, "e": "On compte six instructions SAS : TITLE, FOOTNOTE, PROC PRINT, WHERE, VAR et RUN. Le commentaire n’est pas une instruction.", "img": ["IMG_1848.PNG"], "figure": "code_new_9.png"}, {"t": "LIBNAME", "q": "Quel LIBNAME a une syntaxe correcte ?", "a": ["libname reports \"filepath/workshop\";", "libname orion filepath/workshop;", "libname 3456a \"filepath/workshop\";"], "c": 0, "e": "REPORTS est un libref valide et le chemin est entre guillemets. Un libref ne peut pas commencer par un chiffre.", "img": ["IMG_1849.PNG"]}, {"t": "Bibliothèques", "q": "Parmi ces tables, laquelle est disponible quand je lance une nouvelle session SAS ?", "a": ["sales", "work.newsalesemps", "sashelp.class"], "c": 2, "e": "SASHELP est une bibliothèque permanente fournie par SAS, tandis que WORK est temporaire.", "img": ["IMG_1850.PNG"]}, {"t": "Dates SAS", "q": "Quelle affirmation est FAUSSE ?", "a": ["Une date SAS est l’un des trois types de colonnes SAS : numérique, caractère et date.", "Les dates SAS représentent le nombre de jours écoulés depuis le 1er janvier 1960.", "Les valeurs des dates SAS peuvent être positives ou négatives.", "Les valeurs de date SAS peuvent être utilisées dans des calculs."], "c": 0, "e": "SAS n’a que deux types de variables : numérique et caractère. Une date SAS est une valeur numérique avec un format de date.", "img": ["IMG_1851.PNG"]}, {"t": "LIBNAME", "q": "Quelle LIBNAME a la syntaxe correcte pour lire un fichier Microsoft Excel ?", "a": ["libname excel \"filepath/myexcelfile\";", "libname mydata xlsx \"filepath/myexcelfile\";", "libname mydata xlsx \"filepath/field_data.xlsx\";"], "c": 2, "e": "Le moteur XLSX est indiqué après le libref, avec le chemin d’un fichier .xlsx.", "img": ["IMG_1852.PNG"]}, {"t": "Bibliothèques", "q": "Quel nom de librairie est correct ?", "a": ["2010car", "car/2010", "car2010", "cars_2010"], "c": [2, 3], "e": "Les noms car2010 et cars_2010 sont tous deux valides (lettres, chiffres et underscore, sans commencer par un chiffre). La question comporte donc deux bonnes réponses.", "img": ["IMG_1853.PNG"]}, {"t": "LIBNAME", "q": "Pour dissocier un libref que vous avez précédemment assigné, vous pouvez utiliser l’option UNASSIGN dans l’instruction LIBNAME.", "a": ["Vrai", "Faux"], "c": 1, "e": "La syntaxe de désassignation est LIBNAME libref CLEAR; et non l’option UNASSIGN.", "img": ["IMG_1854.PNG"]}, {"t": "PROC EXPORT", "q": "Quelle PROC EXPORT a une syntaxe valide ?", "a": ["La PROC EXPORT a", "La PROC EXPORT b", "La PROC EXPORT c", "La PROC EXPORT d"], "c": 1, "e": "La syntaxe valide utilise PROC EXPORT DATA=... OUTFILE=... DBMS=CSV REPLACE; suivie de RUN;. Vérifier les quatre variantes dans l’image.", "img": ["IMG_1833.PNG"], "figure": "code_extra_1.png"}, {"t": "Excel et bibliothèques", "q": "Que fait le programme suivant ?", "a": ["Il crée deux tables SAS : sales.q1_2018 et sales.q2_2018", "Il crée deux workbooks Excel : sales.q1_2018 et sales.q2_2018", "Il crée deux feuilles dans un workbook Excel « midyear » : q1_2018 et q2_2018", "Il crée deux feuilles dans un workbook Excel « sales » : q1_2018 et q2_2018"], "c": 2, "e": "Le LIBNAME SALES XLSX pointe vers le fichier midyear.xlsx. Les deux étapes DATA écrivent les feuilles q1_2018 et q2_2018 dans ce même classeur.", "img": ["IMG_1834.PNG"], "figure": "code_extra_2.png"}, {"t": "Excel et bibliothèques", "q": "Quel type d’output ce code va-t-il créer ?", "a": ["Une table SAS", "Un fichier Excel XLS", "Un fichier Excel XLSX", "Un fichier CSV"], "c": 0, "e": "La table CLASS_LIST est créée sans préfixe MYLIB : elle est donc enregistrée dans WORK, et non dans le fichier Excel associé au libref MYLIB.", "img": ["IMG_1835.PNG"], "figure": "code_extra_3.png"}, {"t": "Excel et ODS", "q": "Quel(s) programme(s) permet de créer un fichier Excel ?", "a": ["Le programme a", "Le programme b", "Les deux programmes", "Aucun des deux programmes"], "c": 2, "e": "Le programme a produit un fichier Excel via ODS EXCEL. Le programme b utilise le moteur XLSX dans LIBNAME pour créer une feuille Excel.", "img": ["IMG_1836.PNG"], "figure": "code_extra_4.png"}];
const isCorrect=(i,v)=>Array.isArray(Q[i].c)?Q[i].c.includes(v):Q[i].c===v;const answerLabel=i=>(Array.isArray(Q[i].c)?Q[i].c:[Q[i].c]).map(x=>String.fromCharCode(65+x)).join(' et ');const app=document.getElementById('app');let mode='training',topic='Tous',limit='all',order=[],at=0,selected=null,answers={},done=false,review=false;const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');const image=x=>'images/'+encodeURIComponent(x);const save=()=>{try{localStorage.setItem('sas-wooclap-history',JSON.stringify(JSON.parse(localStorage.getItem('sas-wooclap-history')||'[]').concat([{date:new Date().toISOString(),correct:order.filter(i=>isCorrect(i,answers[i])).length,total:order.length}]).slice(-30)))}catch(e){}};
function home(){let hist=[];try{hist=JSON.parse(localStorage.getItem('sas-wooclap-history')||'[]')}catch(e){}app.innerHTML=`<section class="panel"><span class="pill">Série complète · 48 questions</span><h1>Révise ton examen SAS comme sur Wooclap</h1><p>48 questions issues de tes quatre séries de captures Wooclap. Les extraits de code et tableaux apparaissent directement dans les questions.</p><div class="results"><div class="stat"><b>48</b><span class="muted">Questions</span></div><div class="stat"><b>2</b><span class="muted">Modes</span></div><div class="stat"><b>${hist.length}</b><span class="muted">Sessions</span></div></div><h3>Mode de révision</h3><div class="row"><label><input type="radio" name="mode" value="training" ${mode==='training'?'checked':''}> Entraînement</label><label><input type="radio" name="mode" value="exam" ${mode==='exam'?'checked':''}> Examen blanc</label></div><h3>Chapitre</h3><select id="topic"><option value="Tous">Tous les chapitres</option>${[...new Set(Q.map(x=>x.t))].map(x=>`<option ${topic===x?'selected':''}>${esc(x)}</option>`).join('')}</select><h3>Nombre de questions</h3><select id="limit"><option value="all">Toutes les questions</option><option value="5">5 questions</option><option value="10">10 questions</option></select><div style="margin-top:24px"><button class="btn" id="start">Commencer le quiz →</button></div></section><div class="foot">Les réponses sélectionnées en bleu sur les captures ne sont pas considérées comme des corrections officielles. Certaines formulations ont été conservées telles quelles.</div>`;document.querySelectorAll('[name=mode]').forEach(x=>x.onchange=()=>mode=x.value);document.querySelector('#topic').onchange=e=>topic=e.target.value;document.querySelector('#limit').value=limit;document.querySelector('#limit').onchange=e=>limit=e.target.value;document.querySelector('#start').onclick=()=>start();}
function start(indices){order=indices||Q.map((x,i)=>i).filter(i=>topic==='Tous'||Q[i].t===topic).sort(()=>Math.random()-.5).slice(0,limit==='all'?undefined:Number(limit));at=0;selected=null;answers={};done=false;quiz()}
function quiz(){const q=Q[order[at]];const answered=mode==='training'&&done;app.innerHTML=`<section class="panel"><div class="row"><button class="btn secondary" id="home">← Accueil</button><span class="pill">${mode==='exam'?'Examen blanc':'Entraînement'}</span></div><div class="row" style="margin-top:18px"><b>Question ${at+1} / ${order.length}</b><span class="muted">${esc(q.t)}</span></div><div class="progress"><div style="width:${(at+1)/order.length*100}%"></div></div><h2>${esc(q.q)}</h2>${q.code?`<pre class="code">${esc(q.code)}</pre>`:''}${q.figure?`<img class="figure" src="${image(q.figure)}" alt="Tableau SAS issu de la capture originale">`:''}<div id="options">${q.a.map((x,i)=>`<button class="choice ${selected===i?'selected':''} ${answered&&isCorrect(order[at],i)?'good':''} ${answered&&selected===i&&!isCorrect(order[at],i)?'bad':''}" data-i="${i}" ${answered?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(x)}</span></button>`).join('')}</div>${answered?`<div class="explain"><b>${isCorrect(order[at],selected)?'✓ Bonne réponse':'✗ Réponse incorrecte'} — Réponse ${answerLabel(order[at])}</b><br>${esc(q.e)}</div>`:''}${q.img.length?`<details><summary>Voir les captures Wooclap originales (${q.img.length})</summary><div class="row" style="justify-content:flex-start;margin-top:12px">${q.img.map(x=>`<a href="${image(x)}" target="_blank"><img class="thumb" src="${image(x)}" alt="Capture originale"></a>`).join('')}</div></details>`:""}<div class="row" style="margin-top:22px"><button class="btn secondary" id="prev" ${at===0?'disabled':''}>← Précédente</button><button class="btn" id="next" ${selected===null?'disabled':''}>${mode==='training'&&!done?'Valider':at===order.length-1?'Terminer':'Suivante →'}</button></div></section>`;document.querySelector('#home').onclick=home;document.querySelector('#prev').onclick=()=>{at--;selected=answers[order[at]]??null;done=selected!==null;quiz()};document.querySelectorAll('.choice').forEach(x=>x.onclick=()=>{selected=Number(x.dataset.i);if(mode==='exam')answers[order[at]]=selected;quiz()});document.querySelector('#next').onclick=()=>{if(mode==='training'&&!done){done=true;answers[order[at]]=selected;quiz();return}if(at===order.length-1){save();results();return}at++;selected=answers[order[at]]??null;done=selected!==null;quiz()};}
function results(){const good=order.filter(i=>isCorrect(i,answers[i])).length,wrong=order.filter(i=>!isCorrect(i,answers[i]));app.innerHTML=`<section class="panel"><h1>Résultats du quiz</h1><div class="results"><div class="stat"><b>${Math.round(good/order.length*100)} %</b><span class="muted">Réussite</span></div><div class="stat"><b>${good}</b><span class="muted">Correctes</span></div><div class="stat"><b>${wrong.length}</b><span class="muted">À revoir</span></div></div><div class="row" style="margin-top:22px"><button class="btn secondary" id="home">Accueil</button><button class="btn" id="retry">Recommencer</button>${wrong.length?'<button class="btn secondary" id="errors">Refaire mes erreurs</button>':''}</div><h2>Corrigé détaillé</h2>${order.map((i,n)=>`<div class="panel" style="margin-top:12px;box-shadow:none"><b>${isCorrect(i,answers[i])?'✓':'✗'} ${n+1}. ${esc(Q[i].q)}</b><p>Ta réponse : ${answers[i]===undefined?'Aucune':esc(Q[i].a[answers[i]])}</p><p><b>Bonne réponse :</b> ${esc((Array.isArray(Q[i].c)?Q[i].c:[Q[i].c]).map(j=>Q[i].a[j]).join(" / "))}</p><p>${esc(Q[i].e)}</p>${Q[i].code?`<pre class="code">${esc(Q[i].code)}</pre>`:''}</div>`).join('')}</section>`;document.querySelector('#home').onclick=home;document.querySelector('#retry').onclick=()=>start();if(wrong.length)document.querySelector('#errors').onclick=()=>start(wrong)}home();
